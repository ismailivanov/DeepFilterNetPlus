[workspace]
resolver = "2"

members = [
  "libDF",
  "pyDF",
  "pyDF-data",
  "ladspa",
  "demo",
]

[profile.dev]
opt-level = 1
incremental = false
lto = false

[profile.release]
debug = false
opt-level = 3
lto = "thin"
# Single CGU so the per-hop DSP/inference path gets full cross-unit inlining.
# Note: do NOT ship the .so or capi with `release-lto` — its `panic = "abort"`
# breaks the FFI contract of catching the unsupported-sample-rate panic.
codegen-units = 1

[profile.release-lto]
inherits = "release"
debug = false
lto = "fat"
strip = true
panic = "abort"
