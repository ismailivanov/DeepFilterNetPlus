name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-22.04 # older glibc for wider distro compatibility
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run LADSPA real-time regression tests
        run: cargo test -p deep-filter-ladspa --release
      - name: Build LADSPA plugin and CLI
        run: |
          cargo build --release -p deep-filter-ladspa
          cargo build --release -p deep_filter \
            --no-default-features \
            --features bin,tract,default-model,wav-utils,transforms,logging \
            --bin deep-filter
          strip target/release/libdeep_filter_ladspa.so target/release/deep-filter
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deep-filter-linux-x86_64
          path: |
            target/release/libdeep_filter_ladspa.so
            target/release/deep-filter
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/libdeep_filter_ladspa.so
            target/release/deep-filter
